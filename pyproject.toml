[project]
dynamic = ["version"]
name = "krita-ai-diffusion"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100
preview = true
extend-exclude = [
    "ai_diffusion/websockets",
    "ai_diffusion/debugpy",
    "krita.pyi",
    "*.md",
]

[tool.ruff.lint]
ignore = [
    "E741",
    "EXE001",
    "BLE001",
    "SIM102",
    "T100",
    "TRY300",
    # Preview rules enabled by default in newer ruff; stylistic or false-positive heavy for this codebase.
    "ASYNC240", # blocking pathlib calls in async functions (cheap local fs checks)
    "B027",     # empty methods in abstract base class without @abstractmethod
    "FURB113",  # repeated list.append
    "FURB148",  # unnecessary enumerate
    "FURB171",  # single-item membership test
    "ISC004",   # implicit string concatenation in collection literal
    "PLW0108",  # unnecessary lambda (Qt signal connections)
    "RUF027",   # possible f-string without prefix ("{prompt}" placeholders are intentional)
    "RUF036",   # None not at end of union
    "RUF069",   # float equality comparison
    "SIM115",   # open() without context manager (long-lived log handle)
]

[tool.ruff.format]
docstring-code-format = false

[tool.black]
line-length = 100
preview = true
include = '(ai_diffusion|scripts|tests)/.*\.pyi?$'
extend-exclude = 'websockets|krita\.pyi$'

[tool.pyright]
include = ["ai_diffusion", "scripts/*.py", "tests"]
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
    "**/.server",
    "tests/server",
    "tests/test_image_transfer.py",
    "ai_diffusion/websockets",
    "ai_diffusion/debugpy",
]
ignore = ["ai_diffusion/websockets", "ai_diffusion/debugpy", "krita.pyi"]
extraPaths = ["scripts/typeshed"]
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
